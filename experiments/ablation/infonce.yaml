# Ablation 3: InfoNCE instead of SupCon
# Uses info_nce contrastive mode instead of supcon

dataset_path: "data/csn.jsonl"
model_name: "microsoft/codebert-base"

batch_size: 256
num_epochs: 3
gradient_accumulation_steps: 1
learning_rate: 2.0e-5

seed: 0
run_name: "InvCodeBERT-ablation-infonce"

alpha: 1.0
temperature: 0.1
max_seq_length: 512

contra_mode: "info_nce"
self_contrast: true

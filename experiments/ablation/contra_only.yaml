# Ablation 1b: Contrastive-only (no MLM loss)
# L = alpha * L_contrastive(X, X_inv), mlm_weight=0

dataset_path: "data/csn.jsonl"
model_name: "microsoft/codebert-base"

batch_size: 256
num_epochs: 3
gradient_accumulation_steps: 1
learning_rate: 2.0e-5

seed: 0
run_name: "InvCodeBERT-ablation-contra-only"

alpha: 1.0
mlm_weight: 0
temperature: 0.1
max_seq_length: 512

contra_mode: "supcon"
self_contrast: true

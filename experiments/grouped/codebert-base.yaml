# Grouped multi-key contrastive pre-training
# Usage: python -m modeling.pretrain --config experiments/grouped_example.yaml

dataset_path: "data/aug_csn.jsonl"
model_name: "microsoft/codebert-base"
tokenizer_name: "microsoft/codebert-base"

batch_size: 2
num_epochs: 3
gradient_accumulation_steps: 8
learning_rate: 2.0e-5

seed: 42

# naming: model name + contra mode + aug (aug only / all) + sample rate
run_name: "codebert-grouped-aug-0.2"

alpha: 1.0
temperature: 0.1
max_seq_length: 512
sample_rate: 0.2

contra_mode: "grouped"
max_num_augs: 6

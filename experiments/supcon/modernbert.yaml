# InvPT pre-training: SupCon — ModernBERT-base
# Effective batch size: 64 * 4 = 256
# Usage: python modeling/cli.py run experiments/supcon/modernbert.yaml

dataset_path: "data/csn.jsonl"
model_name: "answerdotai/ModernBERT-base"
model_type: "modernbert"
pooling: "mean"

batch_size: 128
num_epochs: 3
gradient_accumulation_steps: 2
learning_rate: 2.0e-5

seed: 0
run_name: "InvModernBERT-supcon"

alpha: 1.0
temperature: 0.1
max_seq_length: 512

contra_mode: "supcon"
self_contrast: true

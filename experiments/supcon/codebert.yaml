# InvPT pre-training: SupCon — CodeBERT (pilot: larger batch + longer training)
# Effective batch size: 1024 (4x baseline)
# Usage: python modeling/cli.py run experiments/supcon/codebert.yaml

dataset_path: "data/csn.jsonl"
model_name: "microsoft/codebert-base"

batch_size: 1024
num_epochs: 10
gradient_accumulation_steps: 1
learning_rate: 5.0e-6

seed: 0
run_name: "InvCodeBERT-supcon"

alpha: 1.0
temperature: 0.1
max_seq_length: 512

contra_mode: "supcon"
self_contrast: true
